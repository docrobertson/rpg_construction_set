<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realms Construction Set</title>
<style id="app-style">:root {
  --bg: #120e0a;
  --panel: rgba(26, 20, 14, 0.93);
  --panel-solid: #1d1610;
  --panel2: #2a2016;
  --border: #6b5530;
  --border-hi: #b38a3c;
  --gold: #e8c069;
  --gold-dim: #b38a3c;
  --text: #ece2cc;
  --muted: #a8977a;
  --red: #ee6a5a;
  --green: #84d884;
  --blue: #84b8ff;
  --purple: #c8a0ff;
  --font-display: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-display); }
#app, #viewport { position: absolute; inset: 0; }
#app { --hud-top: 44px; --hud-side: 330px; --hud-foot: 184px; --hud-strip: 0px; }
#app[data-layout=play] #viewport { top: var(--hud-top); right: var(--hud-side); bottom: calc(var(--hud-foot) + var(--hud-strip)); left: 0; }
#app[data-layout=editor] #viewport { top: 46px; left: 272px; right: 340px; bottom: 26px; }
#app[data-layout=editor-data] #viewport { top: 46px; left: 272px; right: 0; bottom: 26px; }
#viewport canvas { display: block; outline: none; }
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; user-select: none; -webkit-user-select: none; }
#ui input, #ui textarea { user-select: text; -webkit-user-select: text; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 350ms; z-index: 50; }
#fade.on { opacity: 1; }

button {
  font-family: var(--font-display); font-size: 14px; color: var(--text);
  background: linear-gradient(#3a2c1c, #241a10); border: 1px solid var(--border); border-radius: 4px;
  padding: 6px 12px; cursor: pointer; transition: border-color .15s, background .15s, transform .05s;
}
button:hover { border-color: var(--gold); background: linear-gradient(#4a3824, #2c2014); }
button:active { transform: translateY(1px); }
button:disabled, button.disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: linear-gradient(#a8782c, #6e4c18); border-color: var(--gold); color: #fff6dc; text-shadow: 0 1px 1px #000; }
button.primary:hover { background: linear-gradient(#c08a34, #80581c); }
button.danger { border-color: #8a3a2a; color: #ffb0a0; }
button.danger:hover { border-color: var(--red); }
button.big { font-size: 18px; padding: 12px 20px; }
button.small { font-size: 12px; padding: 3px 8px; }
button.icon { padding: 4px 9px; font-size: 16px; }
button.link { background: none; border: none; color: var(--gold); padding: 2px 0; text-align: left; }

input, textarea, select {
  font-family: var(--font-ui); font-size: 13px; color: var(--text); background: #120d08;
  border: 1px solid #4a3a24; border-radius: 3px; padding: 5px 7px; width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
input[type=checkbox] { width: auto; accent-color: var(--gold); }
input[type=range] { accent-color: var(--gold); padding: 0; }
input[type=color] { padding: 0; width: 44px; height: 26px; background: none; cursor: pointer; }
input[type=color].unset { opacity: 0.35; }
input.bad { border-color: var(--red); }
textarea { resize: vertical; line-height: 1.4; }

.hint { color: var(--muted); font-size: 13px; font-family: var(--font-ui); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.sub { color: var(--gold); font-size: 14px; margin: 12px 0 6px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.panel { background: var(--panel); border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,.5); }
.panel-title { font-size: 18px; color: var(--gold); margin: 2px 0 8px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #3a2c1c; border: 1px solid var(--border); margin: 2px; font-family: var(--font-ui); }
.tag.on { background: #2c4a24; border-color: #5a8a3a; }

/* ---------- floating text, hp bars ---------- */
.float-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.float-text { position: absolute; left: 0; top: 0; font: bold 20px var(--font-ui); text-shadow: 0 0 3px #000, 0 2px 2px #000; white-space: nowrap; will-change: transform; }
.float-text.big { font-size: 30px; }
.hpbar { position: absolute; left: 0; top: 0; width: 36px; height: 5px; background: rgba(0,0,0,.7); border: 1px solid rgba(0,0,0,.9); border-radius: 2px; }
.hpbar i { display: block; height: 100%; background: #5c5; border-radius: 1px; transition: width .2s; }
.screen-flash { position: absolute; inset: 0; pointer-events: none; opacity: 1; transition: opacity .3s; z-index: 3; }

/* ---------- modals & toasts ---------- */
.modal-back { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; pointer-events: auto; }
.modal-back.nodim { background: none; }
.modal {
  min-width: 320px; max-width: min(560px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
  background: linear-gradient(#2a2016, #1a130c); border: 2px solid var(--border-hi); border-radius: 6px;
  box-shadow: 0 10px 50px rgba(0,0,0,.7), inset 0 0 0 1px #000;
}
.modal.wide { max-width: min(860px, 96vw); width: 860px; }
.modal.small { min-width: 300px; max-width: 420px; }
.modal-title { font-size: 20px; color: var(--gold); padding: 12px 18px 8px; border-bottom: 1px solid var(--border); letter-spacing: .5px; }
.modal-body { padding: 14px 18px; overflow: auto; line-height: 1.5; }
.modal-body p { margin: 0 0 10px; }
.modal-body p.big { font-size: 20px; }
.modal-buttons { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 18px 14px; border-top: 1px solid #3a2c1c; flex-wrap: wrap; }
#toasts { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
.toast { background: var(--panel-solid); border: 1px solid var(--gold-dim); padding: 8px 16px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.6); transition: opacity .5s; font-family: var(--font-ui); font-size: 14px; }
.toast.bad { border-color: var(--red); color: #ffd0c8; }
.toast.warn { border-color: #d0a040; }
.toast.out { opacity: 0; }

.choose-list { display: flex; flex-direction: column; gap: 5px; outline: none; }
.choose-item { display: grid; grid-template-columns: 22px 1fr; text-align: left; padding: 8px 10px; gap: 2px 8px; }
.choose-item .ci-key { color: var(--gold); font-family: var(--font-ui); font-size: 12px; grid-row: span 2; align-self: center; }
.choose-item .ci-label { font-size: 15px; }
.choose-item .ci-sub { color: var(--muted); font-size: 12px; font-family: var(--font-ui); grid-column: 2; }
.choose-item:not(:has(.ci-key)) { grid-template-columns: 1fr; }
.choose-item:not(:has(.ci-key)) .ci-sub { grid-column: 1; }
.choose-item.disabled { opacity: .5; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button.on { border-color: var(--gold); background: linear-gradient(#5a4224, #3a2a16); color: #fff; }

/* ---------- title ---------- */
.title-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-start; padding-left: 7vw; pointer-events: none;
  background: radial-gradient(ellipse at 20% 50%, rgba(10,6,2,.85), rgba(10,6,2,.35) 45%, transparent 70%); }
.title-card { pointer-events: auto; max-width: 460px; }
.logo { display: flex; flex-direction: column; line-height: .95; margin-bottom: 14px; text-shadow: 0 3px 12px #000, 0 0 2px #000; }
.logo .l1 { font-size: clamp(54px, 9vw, 96px); color: var(--gold); letter-spacing: 2px; font-variant: small-caps; }
.logo .l2 { font-size: clamp(20px, 3vw, 30px); color: #f4e8cc; letter-spacing: 6px; text-transform: uppercase; margin-left: 4px; }
.tagline { font-size: 17px; color: #e0d4b8; text-shadow: 0 2px 6px #000; margin: 0 0 22px; line-height: 1.45; }
.title-menu { display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
.title-menu button { text-align: left; }
.embedded-title { font-size: 22px; margin-bottom: 18px; color: #fff; text-shadow: 0 2px 6px #000; }
.title-foot { position: absolute; bottom: 14px; left: 7vw; color: rgba(236,226,204,.6); font-size: 13px; text-shadow: 0 1px 3px #000; font-family: var(--font-ui); }
.adv-list { display: flex; flex-direction: column; gap: 8px; }
.adv-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: rgba(0,0,0,.25); border: 1px solid #3a2c1c; border-radius: 4px; }
.adv-info { flex: 1; }
.adv-info b { font-size: 16px; color: #fff3d8; }
.adv-info p { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-family: var(--font-ui); }

/* ---------- party creation ---------- */
.create { position: absolute; inset: 0; pointer-events: none; }
.create > .panel { pointer-events: auto; position: absolute; top: 14px; bottom: 14px; padding: 14px; border-radius: 6px; overflow: auto; }
.create-roster { left: 14px; width: 250px; display: flex; flex-direction: column; gap: 8px; }
.create-roster h2 { margin: 0; color: var(--gold); font-weight: normal; }
.roster-row { display: flex; flex-direction: column; padding: 8px 28px 8px 10px; border: 1px solid #3a2c1c; border-radius: 4px; cursor: pointer; position: relative; background: rgba(0,0,0,.25); }
.roster-row.on { border-color: var(--gold); background: rgba(232,192,105,.12); }
.roster-row span { font-size: 12px; color: var(--muted); font-family: var(--font-ui); }
.roster-row .x { position: absolute; right: 4px; top: 6px; padding: 0 6px; font-size: 14px; }
.create-hero { right: 14px; width: min(540px, calc(100vw - 300px)); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.card { padding: 8px 10px; border: 1px solid #3a2c1c; border-radius: 4px; cursor: pointer; background: rgba(0,0,0,.25); }
.card:hover { border-color: var(--gold-dim); }
.card.on { border-color: var(--gold); background: rgba(232,192,105,.14); }
.card b { font-size: 15px; }
.card small { display: block; color: var(--gold-dim); font-family: var(--font-ui); font-size: 11px; }
.card p { margin: 4px 0 0; font-size: 12px; color: var(--muted); font-family: var(--font-ui); line-height: 1.35; }
.card .traits { color: #9fc89f; margin-top: 4px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.statrow { display: flex; align-items: center; gap: 6px; }
.statrow .sname { flex: 1; }
.statrow .sval { width: 26px; text-align: center; font-size: 18px; color: #fff; }
.statrow i { width: 34px; color: var(--muted); font-size: 12px; font-family: var(--font-ui); }

/* ---------- play HUD: docked around a framed map ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-display); }
.hud > * { pointer-events: auto; }
.hud-frame { position: absolute; top: var(--hud-top); right: var(--hud-side); bottom: calc(var(--hud-foot) + var(--hud-strip)); left: 0; pointer-events: none !important;
  box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px #6b5530, inset 0 0 0 4px #000, inset 0 0 40px rgba(0,0,0,.55); }
.hud-head { position: absolute; top: 0; left: 0; right: 0; height: var(--hud-top); display: flex; align-items: center; gap: 12px; padding: 0 10px;
  background: linear-gradient(#2c2216, #1a130c); border-bottom: 1px solid var(--border-hi); }
.hud-title { font-size: 17px; color: var(--gold); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; font-variant: small-caps; }
.hud-status { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; overflow: hidden; }
.hud-status span { background: rgba(0,0,0,.35); border: 1px solid #4a3a24; padding: 3px 10px; border-radius: 12px; font-size: 14px; white-space: nowrap; }
.hud-status .st-place { color: var(--gold); font-size: 15px; }
.hud-status .gold { color: var(--gold); }
.hud-status .low { color: var(--red); border-color: var(--red); }
.hud-hover { flex: 1; font-size: 13px; color: #d8ccb0; font-family: var(--font-ui); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud-menu { flex: none; }

.hud-side { position: absolute; top: var(--hud-top); right: 0; bottom: 0; width: var(--hud-side); display: flex; flex-direction: column;
  background: linear-gradient(90deg, #1e170f, #17110b); border-left: 1px solid var(--border-hi); overflow: hidden; }
.side-head { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-dim); padding: 8px 12px 4px; font-family: var(--font-ui); }
.hud-party { display: flex; flex-direction: column; gap: 4px; padding: 0 8px 8px; flex: none; }
.pcard { background: rgba(0,0,0,.28); border: 1px solid #3a2c1c; border-radius: 4px; padding: 4px 8px 5px; cursor: pointer; }
.pcard:hover { border-color: var(--gold-dim); }
.pcard.sel { border-color: var(--gold); background: rgba(232,192,105,.10); }
.pcard.active { box-shadow: 0 0 0 1px #fff, 0 0 12px rgba(255,230,140,.55); border-color: #fff; }
.pcard.dead { opacity: .55; }
.pc-head { display: flex; align-items: baseline; gap: 6px; }
.pc-name { font-size: 15px; color: #fff3d8; }
.pc-pts { font: bold 11px var(--font-ui); color: #1a130c; background: var(--gold); border-radius: 8px; padding: 0 5px; }
.pc-status { color: var(--green); font-family: var(--font-ui); }
.pcard.dead .pc-status { color: var(--muted); }
.pc-sub { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--font-ui); white-space: nowrap; }
.pc-bars { display: flex; gap: 4px; margin-top: 3px; }
.pc-bars .bar { flex: 1; height: 13px; margin: 0; }
.pc-bars .bar span { font-size: 9.5px; line-height: 11px; }
.bar { position: relative; height: 14px; background: #0c0805; border: 1px solid #000; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .25s; }
.bar.hp i { background: linear-gradient(#c44a3a, #7a2418); }
.bar.mp i { background: linear-gradient(#4a6ad4, #23367a); }
.bar.xp i { background: linear-gradient(#c8a040, #7a5a18); }
.bar span { position: relative; display: block; font: 10px/12px var(--font-ui); padding-left: 4px; color: #fff; text-shadow: 0 1px 1px #000; white-space: nowrap; }

.hud-hero { flex: 1; overflow-y: auto; border-top: 1px solid #3a2c1c; padding: 8px 12px 12px; scrollbar-width: thin; }
.sheet-title { font-size: 19px; color: #fff3d8; display: flex; justify-content: space-between; align-items: baseline; }
.sheet-title .status { font-size: 12px; color: var(--green); font-family: var(--font-ui); }
.sheet-title .status.bad { color: var(--red); }
.sheet-sub { color: var(--gold-dim); font-size: 13px; font-family: var(--font-ui); margin-bottom: 4px; }
.sheet-bars { margin-bottom: 6px; }
.points { margin: 6px 0 2px; color: #1a130c; background: linear-gradient(#e8c069, #b38a3c); border-radius: 3px; padding: 2px 8px; font: bold 12px var(--font-ui); }
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin: 6px 0; }
.attr { display: flex; align-items: center; gap: 5px; font-size: 14px; min-height: 22px; }
.attr .an { flex: 1; color: var(--muted); font: 12px var(--font-ui); }
.attr b { color: #fff; min-width: 18px; text-align: right; }
.attr i { color: var(--muted); font: 11px var(--font-ui); width: 22px; }
.attr .plus { padding: 0 6px; line-height: 16px; border-color: var(--gold); color: var(--gold); }
.nums { display: grid; grid-template-columns: 1fr; gap: 2px; margin: 6px 0; padding: 5px 8px; background: rgba(0,0,0,.25); border: 1px solid #2e2416; border-radius: 4px; }
.num { display: flex; justify-content: space-between; font-size: 13px; }
.num span { color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.num b { font-weight: normal; color: #fff3d8; font-family: var(--font-ui); font-size: 12px; }
.equip { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.slot { display: flex; gap: 8px; align-items: center; }
.slot-name { color: var(--muted); width: 56px; flex: none; font-family: var(--font-ui); font-size: 12px; }
.slot select { padding: 3px 4px; font-size: 12px; }
.special { margin: 8px 0; padding: 6px 8px; border: 1px solid #5a4424; border-radius: 4px; background: rgba(232,192,105,.07); font-size: 13px; }
.special b { color: var(--gold); }
.special span { color: var(--muted); font: 11px var(--font-ui); }
.special p { margin: 2px 0 0; color: #d8ccb0; font: 12px/1.35 var(--font-ui); }
.special.used { opacity: .6; }
.spells .sub { margin: 6px 0 2px; font-size: 13px; }
.spell-tags .tag { cursor: help; }
.sheet-actions { display: flex; gap: 6px; align-items: center; margin-top: 10px; }

.hud-foot { position: absolute; left: 0; right: var(--hud-side); bottom: 0; height: var(--hud-foot); display: flex; gap: 8px; padding: 8px;
  background: linear-gradient(#1e170f, #15100a); border-top: 1px solid var(--border-hi); }
.hud-logbox { flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(0,0,0,.3); border: 1px solid #3a2c1c; border-radius: 4px; }
.hud-log { flex: 1; overflow-y: auto; padding: 5px 10px; font-size: 14px; line-height: 1.38; scrollbar-width: thin; scrollbar-color: #6b5530 transparent; }
.hud-prompt { flex: none; min-height: 24px; max-height: 42px; padding: 3px 10px; border-top: 1px solid #2e2416; font: 12.5px/17px var(--font-ui); color: var(--muted); overflow: hidden; }
.hud-prompt.on { color: #ffe9a8; background: rgba(232,192,105,.08); }
.log-line { padding: 1px 0; }
.log-line.good { color: var(--green); }
.log-line.bad { color: var(--red); }
.log-line.warn { color: #e8c060; }
.log-line.magic { color: var(--purple); }
.log-line.place { color: var(--gold); font-style: italic; }
.log-line.say { color: #fff; }
.log-line.level { color: #fff060; font-weight: bold; }
.log-line.loot { color: #ffd27a; font-weight: bold; }
.hud-cmds { flex: none; width: 282px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 4px; align-content: stretch; }
.cmd { padding: 4px 6px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd u { color: var(--gold); text-decoration: none; font-weight: bold; font-family: var(--font-ui); font-size: 12px; }
.cmd.special { border-color: var(--gold-dim); white-space: normal; line-height: 1.15; font-size: 13px; }
.cmd.special.disabled { opacity: .45; }
.hud-mapbox { flex: none; width: calc(var(--hud-foot) - 16px); display: flex; align-items: center; justify-content: center; background: #000; border: 1px solid var(--border-hi); border-radius: 4px; }
.hud-minimap { width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; object-fit: contain; }
.party-modal .pack-cols { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
.party-modal .pack-sheet { border-right: 1px solid #3a2c1c; padding-right: 14px; }

/* talk */
.talk-modal { max-width: min(620px, 96vw); width: 620px; background: linear-gradient(#f2e6c6, #e2cfa2); color: #2a1e10; border-color: #6b5530; }
.talk-modal .modal-body { padding: 16px 20px; }
.talk-head { font-size: 18px; border-bottom: 1px solid #b89c64; padding-bottom: 6px; margin-bottom: 8px; }
.talk-head span { color: #6a5434; font-style: italic; font-size: 15px; }
.talk-log { height: 260px; overflow-y: auto; padding-right: 6px; font-size: 16px; line-height: 1.45; }
.talk-log p { margin: 0 0 8px; }
.npc-say { color: #2a1e10; }
.npc-say::before { content: '“'; }
.npc-say::after { content: '”'; }
.you-say { color: #6a4a1a; font-family: var(--font-ui); font-size: 13px; letter-spacing: 1px; }
.talk-log .note { color: #3a6a2a; font-style: italic; font-size: 14px; }
a.kw { color: #8a2a10; font-weight: bold; cursor: pointer; border-bottom: 1px dotted #8a2a10; }
a.kw:hover { color: #c04010; }
.talk-ask { display: flex; gap: 6px; margin-top: 8px; }
.talk-ask input { background: #fffaf0; color: #2a1e10; border-color: #b89c64; font-size: 15px; text-transform: uppercase; }
.talk-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 12px; font-family: var(--font-ui); background: #fff6e0; color: #4a3418; border-color: #b89c64; }
.chip:hover { background: #fff; border-color: #6b5530; }
.chip.bye { margin-left: auto; }

/* shop / party */
.shop-gold { color: var(--gold); margin-bottom: 8px; }
.shop-list { display: flex; flex-direction: column; gap: 6px; }
.shop-row { display: flex; gap: 10px; padding: 7px 10px; background: rgba(0,0,0,.25); border: 1px solid #3a2c1c; border-radius: 4px; align-items: center; }
.sr-main { flex: 1; }
.sr-stats { color: var(--gold-dim); font-size: 12px; margin-left: 8px; font-family: var(--font-ui); }
.sr-desc { color: var(--muted); font-size: 12px; font-family: var(--font-ui); }
.sr-who { color: #8fbf8f; font-size: 11px; font-family: var(--font-ui); }
.sr-side { display: flex; gap: 8px; align-items: center; }
.price { color: var(--gold); white-space: nowrap; }
.owned { font-size: 11px; color: var(--muted); font-family: var(--font-ui); }
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin: 8px 0; }
.stat { display: flex; gap: 6px; align-items: baseline; font-size: 14px; }
.stat span { color: var(--muted); font-family: var(--font-ui); font-size: 12px; min-width: 64px; }
.stat i { color: var(--muted); font-size: 12px; }
.spell-tags { margin-top: 4px; }
.inv { display: flex; flex-direction: column; gap: 3px; max-height: 220px; overflow-y: auto; }
.inv-row { display: flex; gap: 8px; align-items: center; padding: 3px 6px; background: rgba(0,0,0,.2); border-radius: 3px; }
.inv-name { flex: 1; }
.inv-stats { color: var(--gold-dim); font-size: 12px; font-family: var(--font-ui); }
.inv-row button { padding: 2px 8px; font-size: 12px; }
.party-actions { margin-top: 8px; }
.map-modal { max-width: 96vw; }
.map-wrap { display: flex; justify-content: center; }
.bigmap { max-width: 86vw; max-height: 74vh; image-rendering: pixelated; border: 1px solid #000; background: #000; }
.help h3 { color: var(--gold); margin: 12px 0 4px; font-weight: normal; }
.help p { font-family: var(--font-ui); font-size: 14px; }
table.keys { border-collapse: collapse; font-family: var(--font-ui); font-size: 13px; }
table.keys td { padding: 3px 10px 3px 0; }
table.keys td:nth-child(odd) { color: var(--gold); font-weight: bold; }
.intro-modal { background: linear-gradient(#f2e6c6, #e2cfa2); color: #2a1e10; }
.intro-modal .modal-title { color: #5a3a10; border-color: #b89c64; font-size: 26px; text-align: center; }
.intro p { font-size: 17px; line-height: 1.6; }
.intro p:first-child::first-letter { font-size: 2.4em; float: left; line-height: .9; margin: 4px 6px 0 0; color: #8a2a10; }
.victory p { font-size: 17px; line-height: 1.6; }

/* ---------- editor ---------- */
.editor { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-ui); font-size: 13px; }
.editor > * { pointer-events: auto; }
.ed-top { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: linear-gradient(#2c2216, #1a130c); border-bottom: 1px solid var(--border-hi); box-shadow: 0 2px 12px rgba(0,0,0,.6); }
.ed-logo { font-size: 20px; padding: 2px 10px; }
.ed-title { width: 220px; font-family: var(--font-display); font-size: 16px; background: transparent; border-color: transparent; color: var(--gold); }
.ed-title:hover { border-color: #4a3a24; }
.ed-tabs { display: flex; gap: 2px; margin-left: 10px; }
.ed-tabs button { border-radius: 4px 4px 0 0; }
.ed-tabs button.on { border-color: var(--gold); background: linear-gradient(#5a4224, #3a2a16); color: #fff; }
.save-state { font-size: 12px; color: var(--green); margin: 0 6px; white-space: nowrap; }
.save-state.dirty { color: #e8c060; }
.save-state.bad { color: var(--red); }
.ed-left { position: absolute; left: 0; top: 46px; bottom: 26px; width: 272px; overflow-y: auto; padding: 10px; border-width: 0 1px 0 0; scrollbar-width: thin; }
.ed-right { position: absolute; right: 0; top: 46px; bottom: 26px; width: 340px; overflow-y: auto; padding: 10px 12px; border-width: 0 0 0 1px; scrollbar-width: thin; }
.ed-main { position: absolute; left: 272px; top: 46px; bottom: 26px; width: min(640px, calc(100vw - 272px)); overflow-y: auto; padding: 14px 18px; border-width: 0 1px 0 0; scrollbar-width: thin; }
.ed-status { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; line-height: 26px; padding: 0 12px; background: #120d08; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-select { flex: 1; width: auto; }
.tool-section { margin: 8px 0; border-top: 1px solid #3a2c1c; padding-top: 6px; }
.tool-section summary { cursor: pointer; color: var(--gold); font-family: var(--font-display); font-size: 15px; margin-bottom: 6px; list-style: none; display: flex; align-items: center; gap: 6px; }
.tool-section summary::before { content: '▸'; font-size: 11px; color: var(--gold-dim); }
.tool-section[open] summary::before { content: '▾'; }
.tool-section .help { font-size: 11px; color: var(--muted); border: 1px solid #4a3a24; border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; cursor: help; font-family: var(--font-ui); }
.tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tool-grid.small { grid-template-columns: repeat(6, 1fr); }
.tool-grid.small .lb { display: none; }
.tool { display: flex; flex-direction: column; align-items: center; padding: 5px 2px; gap: 1px; font-family: var(--font-ui); }
.tool .ic { font-size: 18px; line-height: 1.1; }
.tool .lb { font-size: 11px; color: #d8ccb0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tool.on { border-color: var(--gold); background: linear-gradient(#6a4c20, #3e2c12); box-shadow: inset 0 0 0 1px rgba(255,220,140,.3); }
.slider { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; font-size: 12px; color: var(--muted); }
.slider input { flex: 1; }
.slider b { width: 20px; text-align: right; color: var(--text); }
.palette { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; margin-top: 6px; max-height: 260px; overflow-y: auto; scrollbar-width: thin; }
.swatch { display: flex; align-items: center; gap: 6px; padding: 3px 5px; font-size: 11px; font-family: var(--font-ui); text-align: left; }
.swatch i { width: 16px; height: 16px; border-radius: 2px; border: 1px solid rgba(0,0,0,.6); flex: none; }
.swatch span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swatch.on { border-color: var(--gold); background: #4a3618; }
.tool-hint { background: rgba(0,0,0,.3); border: 1px solid #3a2c1c; border-radius: 4px; padding: 6px 8px; margin-bottom: 10px; }
.tool-hint b { color: var(--gold); font-family: var(--font-display); font-size: 14px; }
.tool-hint p { margin: 3px 0 0; color: var(--muted); line-height: 1.35; }
.insp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.insp-head b { font-family: var(--font-display); font-size: 17px; color: #fff3d8; }
.insp-head span { color: var(--muted); font-size: 12px; }
.insp-foot { margin-top: 14px; padding-top: 8px; border-top: 1px solid #3a2c1c; }
.form { display: flex; flex-direction: column; gap: 7px; }
.form-section { color: var(--gold); font-family: var(--font-display); font-size: 15px; margin-top: 10px; border-bottom: 1px solid #3a2c1c; padding-bottom: 2px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field-label { font-size: 12px; color: #cfc2a4; }
.field-hint { font-size: 11px; color: var(--muted); line-height: 1.3; }
.field.check { flex-direction: row; align-items: center; gap: 7px; flex-wrap: wrap; }
.field.check .field-hint { flex-basis: 100%; }
.color-wrap { display: flex; gap: 4px; align-items: center; }
.multicheck { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 2px 8px; max-height: 210px; overflow-y: auto; padding: 4px; background: rgba(0,0,0,.2); border-radius: 3px; }
.mc { display: flex; gap: 5px; align-items: flex-start; font-size: 12px; cursor: pointer; line-height: 1.3; }
.mc input { margin-top: 2px; }
.statmods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.statmods label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); }
.itemlist { display: flex; flex-direction: column; gap: 4px; }
.il-row { display: flex; gap: 4px; align-items: center; }
.il-row input[type=number] { width: 64px; flex: none; }
.sublist { display: flex; flex-direction: column; gap: 6px; }
.sl-row { border: 1px solid #3a2c1c; border-radius: 4px; padding: 6px 8px; background: rgba(0,0,0,.2); }
.sl-head { display: flex; justify-content: space-between; align-items: center; color: var(--gold); font-weight: bold; margin-bottom: 4px; }
.sl-btns { display: flex; gap: 3px; }
.cat-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.cat-list button { text-align: left; display: flex; gap: 8px; align-items: center; }
.cat-list button.on { border-color: var(--gold); background: linear-gradient(#5a4224, #3a2a16); }
.cat-list .ic { width: 20px; text-align: center; }
.entry-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; max-height: calc(100vh - 420px); min-height: 120px; overflow-y: auto; scrollbar-width: thin; }
.entry { text-align: left; padding: 4px 8px; font-family: var(--font-ui); font-size: 13px; background: transparent; border-color: transparent; display: flex; justify-content: space-between; align-items: center; }
.entry:hover { background: rgba(255,255,255,.04); border-color: #3a2c1c; }
.entry.on { background: rgba(232,192,105,.15); border-color: var(--gold-dim); }
.entry-group { color: var(--gold-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 6px 0 2px; }
.db-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.db-head h2 { margin: 0; font-family: var(--font-display); font-weight: normal; color: var(--gold); }
.db-head code { color: var(--muted); font-size: 12px; }
.settings-section { margin-bottom: 26px; }
.settings-section h2 { font-family: var(--font-display); font-weight: normal; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.magic-toggles { display: flex; flex-direction: column; gap: 8px; }
.magic-toggle { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid #3a2c1c; border-left-width: 4px; border-radius: 4px; background: rgba(0,0,0,.2); cursor: pointer; }
.magic-toggle input { margin-top: 4px; transform: scale(1.3); }
.magic-toggle b { font-family: var(--font-display); font-size: 16px; }
.magic-toggle .res { color: var(--muted); font-size: 12px; }
.magic-toggle p { margin: 3px 0; color: #d8ccb0; }
.magic-toggle small { color: var(--muted); }

@media (max-width: 860px) {
  #app { --hud-side: 0px; --hud-foot: 236px; --hud-top: 40px; --hud-strip: 52px; }
  /* the company becomes a strip of cards above the log; the full sheet lives in the Pack */
  .hud-side { top: auto; bottom: var(--hud-foot); left: 0; width: auto; height: var(--hud-strip); border-left: none; border-top: 1px solid var(--border-hi); }
  .side-head, .hud-hero { display: none; }
  .hud-party { flex-direction: row; overflow-x: auto; padding: 4px 6px; }
  .pcard { min-width: 140px; }
  .hud-title { display: none; }
  .hud-hover { display: none; }
  .hud-foot { flex-wrap: wrap; height: var(--hud-foot); }
  .hud-logbox { flex-basis: 100%; height: 110px; flex: none; }
  .hud-cmds { flex: 1; width: auto; }
  .hud-mapbox { width: 100px; }
  .party-modal .pack-cols { grid-template-columns: 1fr; }
  .party-modal .pack-sheet { border: none; padding: 0; }
  .create-roster { width: auto; right: 14px; bottom: auto; max-height: 40vh; }
  .create-hero { width: auto; left: 14px; top: 42vh; }
  #app[data-layout=editor] #viewport { left: 220px; right: 260px; }
  #app[data-layout=editor-data] #viewport { left: 220px; }
  .ed-left { width: 220px; }
  .ed-right { width: 260px; }
  .ed-main { left: 220px; }
  .ed-title { width: 120px; }
}
.cont-sub { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-ui); margin-top: 2px; }
</style>
</head>

<h3>Exploring</h3>
<p><b>Arrow keys / WASD</b> move. Click a tile to walk there. Bump into people to talk, into monsters to fight.
Step onto towns, caves and stairs to enter them; walk off the edge of a town to leave.</p>
<table class="keys">
<tr><td>T</td><td>Talk (then a direction)</td><td>L</td><td>Look</td></tr>
<tr><td>C</td><td>Cast a spell</td><td>U</td><td>Use an item</td></tr>
<tr><td>I</td><td>Pack &amp; equipment</td><td>H</td><td>Hole up (camp &amp; rest)</td></tr>
<tr><td>M</td><td>Map</td><td>Space</td><td>Wait a turn</td></tr>
<tr><td>Ctrl/\u2318+S</td><td>Save</td><td>Esc</td><td>Menu</td></tr>
</table>
<h3>Your company</h3>
<p>Click a hero on the right to see their sheet. Each hero carries a <b>hand weapon</b> for melee and a <b>ranged weapon</b>
(bow, crossbow or sling) \u2014 change either, and armour and shield, straight from the sheet. Every level brings an
<b>attribute point</b> (\u25B2) to spend with the <b>+</b> buttons.</p>
<h3>Talking</h3>
<p>Type a word to ask about it \u2014 <b>NAME</b>, <b>JOB</b> and anything the person mentions. Highlighted words are worth asking about.
Merchants answer to <b>BUY</b>, innkeepers to <b>ROOM</b>, healers to <b>HEAL</b>, and some folk will <b>JOIN</b> your company.</p>
<h3>Battle</h3>
<p>Each hero acts in turn, then the enemy. Move with the arrows and bump a foe to strike. <b>F</b> attacks \u2014 with your bow if the foe is
out of reach. <b>Q</b> uses your class special, once per battle: Whirlwind, Volley, Blink, Shadow Strike and more.
<b>C</b> casts, <b>U</b> uses an item, <b>Space</b> waits. Walk off the edge of the field to flee. Fallen foes sometimes leave gear behind.</p>
<table class="keys">
<tr><td>F</td><td>Attack / shoot</td><td>Q</td><td>Class special</td></tr>
<tr><td>C</td><td>Cast</td><td>U</td><td>Use item</td></tr>
<tr><td>Tab</td><td>Next target</td><td>Enter</td><td>Confirm target</td></tr>
</table>
<h3>Survival</h3>
<p>Food runs down as you travel. Swamps may poison you. Rest at inns, or hole up in the wild (if no foes are near).

<p>Everything you build is saved in this browser as you go. Here is the usual way to make an adventure:</p>
<h3>1 \xB7 Shape the world</h3>
<p>On the <b>Map</b> tab, use <b>Shape the land</b>: click to drop an island, a lake, a forest or a mountain range \u2014 or drag to keep stamping.
Change the <b>stamp size</b> for continents or copses. <b>Draw paths</b> lets you drag out roads (they bridge rivers on their own), rivers and mountain ridges.</p>
<h3>2 \xB7 Found towns, castles and dungeons</h3>
<p>Under <b>Found a site</b>, click the map to create a town, castle, village, dungeon, tower, dark fortress, elven hall or dwarf hold.
Each one gets its own generated map \u2014 streets, shops, an inn, a healer and townsfolk. <b>Double-click</b> a site (or select it and press <i>Open</i>) to go inside and change anything.</p>
<h3>3 \xB7 Paint the details</h3>
<p><b>Paint tiles</b> gives you a brush, scatter, line, rectangle, flood fill and picker, with every tile type \u2014 walls, doors, counters, beds, braziers, lava\u2026</p>
<h3>4 \xB7 People, monsters and treasure</h3>
<p>Place <b>people</b> and give them a role (shopkeeper, innkeeper, healer, king\u2026), a look, and <b>keywords</b> they answer to.
A keyword can require a flag, item or gold, and can give items or gold, set story flags, heal the party, make the speaker <b>join</b> your company, start a fight, teleport the party \u2014 or win the game.
Place <b>monster groups</b>, <b>chests</b>, <b>signs</b>, <b>ships</b>, <b>waygates</b> and <b>passages</b> (links between maps \u2014 use <i>Pick arrival point</i> to choose where they lead).</p>
<h3>5 \xB7 Rules of the realm</h3>
<p><b>World Data</b> holds the races, classes, items, spells, monsters and the magic systems themselves. <b>Settings</b> holds your story, the starting point and kit,
the victory condition, and switches for the four kinds of magic \u2014 Sorcery, Prayer, Rune-craft and Elven Song.</p>
<h3>6 \xB7 Playtest and share</h3>
<p>Press <b>\u25B6 Playtest</b> at any time \u2014 from the start, or from wherever you are looking. Use <b>File \u2192 Export</b> to save a <i>.json</i> game file,
or a single <i>.html</i> page your friends can simply open and play.</p>
<h3>Keys</h3>
